# Example config. API key can also be provided via OPENAI_API_KEY env var.
# base_url may or may not include /v1 — it's added automatically if missing.
base_url: https://api.openai.com/v1
models:
  - gpt-4o-mini
api_key: sk-REPLACE_ME

# Benchmark mode settings (used with --mode benchmark).
# benchmark:
#   iterations: 10     # number of iterations per case
#   concurrency: 5    # concurrent goroutines per iteration
#   prompt: pong      # prompt style: pong (latency-only) or long (throughput)
