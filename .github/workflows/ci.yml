name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Keep the toolchain in sync with go.mod instead of pinning here.
          go-version-file: go.mod
      # Tool versions (golangci-lint) live in the Makefile: run the same
      # targets locally and in CI so there is a single source of truth.
      - run: make verify
      - run: make test
